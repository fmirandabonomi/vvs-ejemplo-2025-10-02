repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: mixed-line-ending
  - id: check-merge-conflict
- repo: https://github.com/pocc/pre-commit-hooks
  rev: v1.3.5
  hooks:
  - id: clang-format
- repo: local
  hooks:
  - id: platformio-cppcheck
    name: PlatformIO Cppcheck
    entry: pio check -e nativo --src-filters="+<lib/**>" --flags "--suppress=unusedFunction --addon=misra.py" --fail-on-defect=high
    language: system
    pass_filenames: false
