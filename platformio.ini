; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nativo

[env]
build_flags = -Wall -Wextra -Werror

[env:denky32]
platform = espressif32
board = denky32
framework = arduino

[env:nativo]
platform = native
check_tool =
	cppcheck
	clangtidy
check_flags =
	cppcheck: --enable=warning,performance,style --suppress=unusedFunction --addon=./misra.json --inline-suppr
	clangtidy: --checks=bugprone-*,cert-*,clang-analyzer-*,performance-*,portability-*,readability-*,hicpp-*
check_src_filters =
	+<src/**>
	+<include/**>
	+<lib/**>
check_severity =
	high
	medium
	low

[env:D1_R32]
platform = espressif32
board = wemos_d1_uno32
framework = arduino
